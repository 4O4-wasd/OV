version: '3'

tasks:
  install:
    desc: Install dependencies for all apps
    cmds:
      - task: install:api

  build:
    desc: Build all apps
    cmds:
      - task: build:api

  typecheck:
    desc: Typecheck all apps
    cmds:
      - task: typecheck:api

  install:api:
    dir: apps/api
    cmds:
      - pnpm install

  build:api:
    dir: apps/api
    cmds:
      - pnpm build

  typecheck:api:
    dir: apps/api
    cmds:
      - pnpm typecheck
